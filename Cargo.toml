[package]
name = "agentgrep"
version = "0.1.7"
edition = "2024"
description = "CLI-first code search and retrieval for agents"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.14"
